
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Configuración -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Trainer</title>

    <!-- Conecta con el archivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenido principal -->
    <main>

        <!-- MENÚ PRINCIPAL -->
        <section id="menu">

            <!-- Título principal -->
            <div class="menu-hero">
                <p class="menu-label">LET'S LEARN PIANO</p>

                <h1>
                    PIANO<br>
                    <span>TRAINER.</span>
                </h1>

                <p class="menu-description">
                    JUST THE CLASSICS
                </p>
            </div>

            <!-- Selección de canciones -->
            <div class="menu-tracks">
                <h2>01 / CHOOSE YOUR FIGHTER</h2>

                <!-- JavaScript agrega las canciones -->
                <div id="song-list"></div>
            </div>

            <!-- Modo libre -->
            <div class="menu-free">
                <span>02 / OR MAKE YOURS</span>

                <!-- ID para JavaScript -->
                <button id="free-play">
                    FREE MODE - HIT IT!  <span>↗</span>
                </button>
            </div>

            <!-- Pie del menú -->
            <div class="menu-footer">
                <span>I DON´T KNOW HOW TO PLAY MUSIC EITHER, DON´T WORRY</span>
                <span>PIANO TRAINER - PROYECTO II</span>
            </div>

        </section>

            <!-- PANTALLA DEL JUEGO -->
            <section id="game" hidden>

                <!-- Nombre de la canción -->
                <h2 id="song-title"></h2>

                <!-- Contadores del juego -->
                <p>Progress: <span id="progress">0 / 0</span></p>
                <p>Dead soldiers: <span id="misses">0</span></p>

                <!-- Donde caen las notas -->
                <div id="note-area">

                    <!-- Línea donde se deben tocar las notas -->
                    <div id="hit-line"></div>

                </div>

                <!-- Piano creado en JavaScript -->
                <div id="piano"></div>

                <!-- Regresar al menú -->
                <button id="back-button">Let's rest for now</button>

            </section>

            <!-- RESULTADOS -->
            <section id="results" hidden>

                <h2>YOUS SMASHED IT!</h2>

                <!-- Resultados finales -->
                <p id="final-results"></p>

                <!-- Botones de resultados -->
                <button id="play-again">Second round?</button>
                <button id="results-menu">Let's rest for now</button>

            </section>

    </main>

    <!-- Conecta el archivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
